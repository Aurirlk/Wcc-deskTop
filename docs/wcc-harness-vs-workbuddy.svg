<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="680" height="520" fill="#0f1419"/>
  <!-- title -->
  <text x="340" y="28" text-anchor="middle" fill="#e8eaed" font-size="14" font-weight="500">WorkBuddy 六层 Harness ↔ WCC 魔兽 AI 编辑器 对照</text>
  <text x="340" y="46" text-anchor="middle" fill="#8b93a1" font-size="11">桌面 Agent 操作系统 vs 领域化地图/战役 Harness</text>

  <!-- left column header -->
  <rect x="36" y="60" width="290" height="28" rx="6" fill="#1a2332" stroke="#3d4f6f"/>
  <text x="181" y="79" text-anchor="middle" fill="#7eb6ff" font-size="12" font-weight="500">WorkBuddy（通用办公 Agent）</text>

  <!-- right column header -->
  <rect x="354" y="60" width="290" height="28" rx="6" fill="#1a2820" stroke="#3d5f4f"/>
  <text x="499" y="79" text-anchor="middle" fill="#7ee0a8" font-size="12" font-weight="500">WCC（AI 魔兽 Harness）</text>

  <!-- L1 UI -->
  <rect x="36" y="100" width="290" height="48" rx="8" fill="#151c26" stroke="#3d4f6f" stroke-width="0.5"/>
  <text x="50" y="120" fill="#c5cdd8" font-size="12" font-weight="500">L1 用户界面</text>
  <text x="50" y="136" fill="#8b93a1" font-size="11">Electron 桌面 · 聊天 · 任务面板</text>

  <rect x="354" y="100" width="290" height="48" rx="8" fill="#151c26" stroke="#3d5f4f" stroke-width="0.5"/>
  <text x="368" y="120" fill="#c5cdd8" font-size="12" font-weight="500">L1 用户界面</text>
  <text x="368" y="136" fill="#8b93a1" font-size="11">Web Studio (TS) · 对话时间轴 · 预览</text>

  <!-- arrows mid -->
  <line x1="326" y1="124" x2="354" y2="124" stroke="#5a6a80" stroke-width="1" marker-end="url(#chev)"/>
  <defs>
    <marker id="chev" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#5a6a80" stroke-width="1"/>
    </marker>
    <marker id="chev2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#4a5a70" stroke-width="1"/>
    </marker>
  </defs>

  <!-- L2 Runtime -->
  <rect x="36" y="160" width="290" height="48" rx="8" fill="#151c26" stroke="#3d4f6f" stroke-width="0.5"/>
  <text x="50" y="180" fill="#c5cdd8" font-size="12" font-weight="500">L2 Agent 推理</text>
  <text x="50" y="196" fill="#8b93a1" font-size="11">Agent Loop · 多模型档位 · SubAgent</text>

  <rect x="354" y="160" width="290" height="48" rx="8" fill="#151c26" stroke="#3d5f4f" stroke-width="0.5"/>
  <text x="368" y="180" fill="#c5cdd8" font-size="12" font-weight="500">L2 Agent 推理</text>
  <text x="368" y="196" fill="#8b93a1" font-size="11">战役计划 · Lua 生成 · 布局规划</text>

  <!-- L3 Tools -->
  <rect x="36" y="220" width="290" height="48" rx="8" fill="#151c26" stroke="#3d4f6f" stroke-width="0.5"/>
  <text x="50" y="240" fill="#c5cdd8" font-size="12" font-weight="500">L3 工具执行</text>
  <text x="50" y="256" fill="#8b93a1" font-size="11">文件 · Shell · 办公软件 · 浏览器</text>

  <rect x="354" y="220" width="290" height="48" rx="8" fill="#151c26" stroke="#3d5f4f" stroke-width="0.5"/>
  <text x="368" y="240" fill="#c5cdd8" font-size="12" font-weight="500">L3 工具执行 ★领域</text>
  <text x="368" y="256" fill="#8b93a1" font-size="11">wc3-forge MCP · wcc-lib · wcc build</text>

  <!-- L4 Ext -->
  <rect x="36" y="280" width="290" height="48" rx="8" fill="#151c26" stroke="#3d4f6f" stroke-width="0.5"/>
  <text x="50" y="300" fill="#c5cdd8" font-size="12" font-weight="500">L4 扩展系统</text>
  <text x="50" y="316" fill="#8b93a1" font-size="11">Skill · MCP Connector · 专家包</text>

  <rect x="354" y="280" width="290" height="48" rx="8" fill="#151c26" stroke="#3d5f4f" stroke-width="0.5"/>
  <text x="368" y="300" fill="#c5cdd8" font-size="12" font-weight="500">L4 扩展系统 ★领域</text>
  <text x="368" y="316" fill="#8b93a1" font-size="11">wcc-skill · patterns · wcc-mcp</text>

  <!-- L5 Memory -->
  <rect x="36" y="340" width="290" height="48" rx="8" fill="#151c26" stroke="#3d4f6f" stroke-width="0.5"/>
  <text x="50" y="360" fill="#c5cdd8" font-size="12" font-weight="500">L5 记忆系统</text>
  <text x="50" y="376" fill="#8b93a1" font-size="11">工作区 / 用户 / 云 profile</text>

  <rect x="354" y="340" width="290" height="48" rx="8" fill="#151c26" stroke="#3d5f4f" stroke-width="0.5"/>
  <text x="368" y="360" fill="#c5cdd8" font-size="12" font-weight="500">L5 记忆系统</text>
  <text x="368" y="376" fill="#8b93a1" font-size="11">战役项目 · 章节进度 · 用户偏好</text>

  <!-- L6 Safety -->
  <rect x="36" y="400" width="290" height="48" rx="8" fill="#151c26" stroke="#3d4f6f" stroke-width="0.5"/>
  <text x="50" y="420" fill="#c5cdd8" font-size="12" font-weight="500">L6 安全治理</text>
  <text x="50" y="436" fill="#8b93a1" font-size="11">权限 · Hooks · 沙盒 · 审计</text>

  <rect x="354" y="400" width="290" height="48" rx="8" fill="#151c26" stroke="#3d5f4f" stroke-width="0.5"/>
  <text x="368" y="420" fill="#c5cdd8" font-size="12" font-weight="500">L6 安全治理 ★领域</text>
  <text x="368" y="436" fill="#8b93a1" font-size="11">改图确认 · lua-check 门禁 · 回滚</text>

  <!-- vertical connectors left -->
  <line x1="181" y1="148" x2="181" y2="160" stroke="#4a5a70" stroke-width="1" marker-end="url(#chev2)"/>
  <line x1="181" y1="208" x2="181" y2="220" stroke="#4a5a70" stroke-width="1" marker-end="url(#chev2)"/>
  <line x1="181" y1="268" x2="181" y2="280" stroke="#4a5a70" stroke-width="1" marker-end="url(#chev2)"/>
  <line x1="181" y1="328" x2="181" y2="340" stroke="#4a5a70" stroke-width="1" marker-end="url(#chev2)"/>
  <line x1="181" y1="388" x2="181" y2="400" stroke="#4a5a70" stroke-width="1" marker-end="url(#chev2)"/>

  <!-- vertical connectors right -->
  <line x1="499" y1="148" x2="499" y2="160" stroke="#4a5a70" stroke-width="1" marker-end="url(#chev2)"/>
  <line x1="499" y1="208" x2="499" y2="220" stroke="#4a5a70" stroke-width="1" marker-end="url(#chev2)"/>
  <line x1="499" y1="268" x2="499" y2="280" stroke="#4a5a70" stroke-width="1" marker-end="url(#chev2)"/>
  <line x1="499" y1="328" x2="499" y2="340" stroke="#4a5a70" stroke-width="1" marker-end="url(#chev2)"/>
  <line x1="499" y1="388" x2="499" y2="400" stroke="#4a5a70" stroke-width="1" marker-end="url(#chev2)"/>

  <!-- footer note -->
  <text x="340" y="470" text-anchor="middle" fill="#8b93a1" font-size="11">L3–L4–L6 标 ★：WCC 需要自建的领域层；地图数据层外包给 wc3-forge 等 MCP</text>
  <text x="340" y="490" text-anchor="middle" fill="#5a6570" font-size="10">通用能力对齐 WorkBuddy；差异在魔兽地图/战役/触发器的世界动作</text>
</svg>
